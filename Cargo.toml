[package]
name = "archboard"
version = "0.1.0"
edition = "2024"
description = "Architecture board for any repository: drag its packages, folders and modules into a new layout, check it against architecture rules, and have Claude Code carry it out"
repository = "https://github.com/adamvalt/archboard"
readme = "README.md"
keywords = ["architecture", "refactoring", "claude", "dependency-graph"]
categories = ["development-tools", "command-line-utilities"]
publish = false

# Stays its own workspace when checked out inside another Cargo workspace.
[workspace]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "net", "time"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
